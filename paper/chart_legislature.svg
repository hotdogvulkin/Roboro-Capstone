<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#FFFFFF"/><g transform="translate(0,220.0)"><text x="0" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#1A1626" text-anchor="start" font-weight="600">Budgets enacted on time, by legislature type</text><text x="0" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6B6480" text-anchor="start" font-weight="400">Share of tracked budgets enacted on or before the state's own fiscal year start</text><rect x="300" y="110" width="580" height="84" rx="5" fill="#F4F2F7"/><rect x="300" y="110" width="556.5" height="84" rx="5" fill="#1D9E75"/><text x="278" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1A1626" text-anchor="end" font-weight="500">Part-time (citizen)</text><text x="278" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1A1626" text-anchor="end" font-weight="500">legislatures</text><text x="870.4917200854702" y="160.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#1D9E75" text-anchor="start" font-weight="600">96%</text><text x="278" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#6B6480" text-anchor="end" font-weight="400">32 states</text><rect x="300" y="256" width="580" height="84" rx="5" fill="#F4F2F7"/><rect x="300" y="256" width="383.4" height="84" rx="5" fill="#E60058"/><text x="278" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1A1626" text-anchor="end" font-weight="500">Full-time (professional)</text><text x="278" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1A1626" text-anchor="end" font-weight="500">legislatures</text><text x="697.3993783993784" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#E60058" text-anchor="start" font-weight="600">66%</text><text x="278" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#6B6480" text-anchor="end" font-weight="400">18 states</text><line x1="0" y1="408" x2="1000" y2="408" stroke="#E3E0EA"/><text x="0" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#1A1626" text-anchor="start" font-weight="500">The single strongest structural predictor in the dataset (p = 0.0003).</text><text x="0" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6B6480" text-anchor="start" font-weight="400">Short, constitutionally capped sessions force the work to finish; year-round chambers can always sit another week.</text></g></svg>